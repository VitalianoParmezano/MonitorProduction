<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor Production</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <main class="entry">
    <h1>Monitor Production</h1>
    <div class="card">
      <label for="station-no">Номер робочого місця (1–4)</label>
      <input id="station-no" type="number" min="1" max="4" inputmode="numeric" autofocus>
      <button id="go-station" class="primary">Перейти</button>
    </div>
    <div class="card">
      <a class="button" href="/service/">Сервісний режим</a>
      <a class="button" href="/admin/">Адміністрування</a>
    </div>
  </main>

  <script type="module">
    const input = document.getElementById("station-no");
    function go() {
      const n = parseInt(input.value, 10);
      if (!n || n < 1 || n > 4) {
        alert("Введіть номер від 1 до 4");
        return;
      }
      location.href = `/station/?n=${n}`;
    }
    document.getElementById("go-station").addEventListener("click", go);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  </script>
</body>
</html>
