<form class="tpl" autocomplete="off">
  <label>Штрихкод
    <input name="barcode" data-scan required>
  </label>
  <label><span data-label>Значення</span>
    <span class="row">
      <input name="value" type="text" inputmode="decimal" required>
      <span class="unit" data-unit></span>
    </span>
  </label>
  <button type="submit">Відправити</button>
  <div class="result" data-result></div>
</form>
