<form class="tpl" autocomplete="off">
  <label>Штрихкод
    <input name="barcode" data-scan required>
  </label>
  <div class="check-q" data-label>Перевірка пройдена?</div>
  <div class="verdicts">
    <button type="button" class="pass" data-answer="yes">Так</button>
    <button type="button" class="fail" data-answer="no">Ні</button>
  </div>
  <div class="result" data-result></div>
</form>
