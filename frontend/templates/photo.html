<form class="tpl" autocomplete="off">
  <label>Штрихкод
    <input name="barcode" data-scan required>
  </label>
  <label class="file-btn">
    <span data-file-title>Обрати або зробити фото</span>
    <input name="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
  </label>
  <button type="submit">Відправити</button>
  <div class="result" data-result></div>
</form>
