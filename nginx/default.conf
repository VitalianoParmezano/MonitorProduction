server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # Превʼю в адмінці відкриває оболонку в iframe з того ж origin
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /uploads/;
        autoindex off;
        # add_header в location скидає успадковані, тому X-Frame-Options повторено
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Статика змінюється рідко, але має завжди перевірятися на свіжість
    location ~* \.(html|js|json|css)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
