# Monitor Production — Nginx.
# HTTPS на 443, роздає статику frontend/ і uploads/ (том ro), проксує /api/ на бекенд.
# Порт 80 переадресовує на 443.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 10m;

    # проксі на бекенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # завантажені файли (тільки читання)
    location /uploads/ {
        alias /app/uploads/;
    }

    # фронтенд (без збірки)
    location / {
        root /app/frontend;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
